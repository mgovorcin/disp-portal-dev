[project]
name = "disp-portal"
version = "0.0.1"
description = "OPERA DISP portal on GeoLibre: ASF client, tile decoder, proxy"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10",
    "shapely>=2",
    "mercantile>=1.2",
    "xarray>=2024.6",
    "rioxarray>=0.17",
    "pyproj>=3.6",
    "zarr>=3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
disp-proxy = "disp_portal.proxy:main"

[project.optional-dependencies]
notebook = ["geolibre[raster]", "matplotlib", "ipykernel", "ipywidgets", "jupyter-ui-poll", "nbformat", "nbclient"]

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=8",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/disp_portal"]

[tool.ruff]
extend-exclude = ["vendor", "plugin", "geolibre-web"]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
