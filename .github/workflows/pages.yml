name: Pages

# Static build of GeoLibre + the OPERA DISP plugin, deployed to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 1 * *" # monthly: refresh the mirrored ASF velocity overview

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=7168
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache GeoLibre checkout and dependencies
        uses: actions/cache@v4
        with:
          path: vendor/GeoLibre
          key: geolibre-${{ hashFiles('GEOLIBRE_COMMIT') }}-v1

      - name: Python dependencies (overview mirror)
        run: pip install -e . --quiet

      - name: Cache mirrored ASF overview tiles (refreshed monthly)
        uses: actions/cache@v4
        with:
          path: .cache/overview-webp
          key: overview-webp-${{ github.run_id }}
          restore-keys: overview-webp-

      - name: Monthly refresh of the overview mirror
        if: github.event_name == 'schedule'
        run: rm -rf .cache/overview-webp

      - name: Plugin dependencies and tests
        working-directory: plugin
        run: |
          npm ci
          npm test

      - name: Build static site
        run: scripts/build_pages.sh "/${{ github.event.repository.name }}/" dist-pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
