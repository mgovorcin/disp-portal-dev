name: Pages

# Static build of GeoLibre + the OPERA DISP plugin, deployed to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=7168
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache GeoLibre checkout and dependencies
        uses: actions/cache@v4
        with:
          path: vendor/GeoLibre
          key: geolibre-${{ hashFiles('GEOLIBRE_COMMIT') }}-v1

      - name: Plugin dependencies and tests
        working-directory: plugin
        run: |
          npm ci
          npm test

      - name: Build static site
        run: scripts/build_pages.sh "/${{ github.event.repository.name }}/" dist-pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
